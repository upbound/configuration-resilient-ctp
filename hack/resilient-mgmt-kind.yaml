# Reusable kind manifest for the `resilient-mgmt` management cluster.
#
#   kind create cluster --config hack/resilient-mgmt-kind.yaml
#
# WHY THIS EXISTS (see docs/MGMT-CLUSTER-PERFORMANCE.md for the full write-up):
# A default kind cluster running Crossplane + the aws/azure/gcp provider FAMILIES
# (~500 CRDs) repeatedly crashloops kube-scheduler / kube-controller-manager /
# crossplane with "leader election lost: context deadline exceeded". The
# bottleneck is NOT RAM/CPU (the host had 26GB free, 14 cores idle) — it is
# etcd's WAL fsync latency on Docker Desktop's virtualized disk, saturated by the
# write volume from ~500 CRDs. Every leader-election lease renewal is an etcd
# write that must fsync; when fsync is slow and the queue backs up, renewals miss
# their deadline and the component dies.
#
# This manifest removes both halves of the bottleneck:
#   1. etcd dataDir -> /tmp/etcd, which is TMPFS (RAM) inside the kind node, so
#      fsync is memory-speed. (Confirmed: `/tmp` is tmpfs, sized ~50% of the
#      Docker VM RAM; `/dev/shm` is only 64MB so is NOT used.)
#   2. etcd tuning + relaxed leader-election so transient spikes never crashloop
#      the control plane.
#
# ⚠️ DURABILITY TRADEOFF: tmpfs is RAM — a kind node restart or a Docker Desktop
# restart WIPES etcd, destroying all cluster state (Crossplane installs, XRs,
# ProviderConfigs). That is fine for a DISPOSABLE test management cluster you
# recreate from scratch, which is exactly this cluster's role. Do NOT use tmpfs
# etcd for anything whose state you cannot afford to lose on restart — for that,
# delete the `etcd.local.dataDir` line below (etcd falls back to on-disk
# /var/lib/etcd) and keep only the tuning + leader-election relaxation, which
# alone fixes the crashloop while staying durable.
#
# The other durable lever (recommended regardless): install only the SPECIFIC
# service providers the tests need instead of whole provider families, to cut the
# CRD/write load. See the performance doc.
---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: resilient-mgmt
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # kubeadm v1beta4 (Kubernetes 1.31+); extraArgs are name/value LISTS.
      - |
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: ClusterConfiguration
        etcd:
          local:
            # RAM-backed etcd: /tmp is tmpfs in the kind node -> fsync at memory
            # speed. Remove this line to keep etcd on-disk (durable) and rely on
            # the tuning + leader-election relaxation below instead.
            dataDir: /tmp/etcd
            extraArgs:
              # Default backend quota is 2Gi; ~500 CRDs + churn can approach it.
              - name: quota-backend-bytes
                value: "8589934592"        # 8 GiB
              # Snapshot less often (fewer fsync-heavy compactions).
              - name: snapshot-count
                value: "10000"
              # Be tolerant of slower disk if dataDir is ever moved off tmpfs.
              - name: heartbeat-interval
                value: "250"               # ms
              - name: election-timeout
                value: "2500"              # ms
        # Relaxed leader-election so a transient etcd/API stall does not crashloop
        # the control-plane controllers (defaults are 15s/10s/2s).
        controllerManager:
          extraArgs:
            - name: leader-elect-lease-duration
              value: "60s"
            - name: leader-elect-renew-deadline
              value: "45s"
            - name: leader-elect-retry-period
              value: "10s"
        scheduler:
          extraArgs:
            - name: leader-elect-lease-duration
              value: "60s"
            - name: leader-elect-renew-deadline
              value: "45s"
            - name: leader-elect-retry-period
              value: "10s"
