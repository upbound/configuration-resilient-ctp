apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: resilientcontrolplanes.resilient.platform.upbound.io
spec:
  group: resilient.platform.upbound.io
  scope: Namespaced
  names:
    kind: ResilientControlPlane
    plural: resilientcontrolplanes
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: Specification for a resilient control plane member
              required:
                - identity
                - members
                - gslb
              properties:
                providerConfigName:
                  type: string
                  description: Default provider config name used for heartbeat resources
                  default: default
                identity:
                  type: object
                  description: Identity of this control plane in the resilience set
                  required:
                    - id
                    - provider
                    - region
                    - geoTag
                    - priority
                  properties:
                    id:
                      type: string
                      description: Control plane ID (matches its ControlPlane id)
                    provider:
                      type: string
                      description: Cloud provider
                      enum:
                        - aws
                        - azure
                        - gcp
                        - alibaba
                    region:
                      type: string
                      description: Cloud region where this control plane runs
                    geoTag:
                      type: string
                      description: Geographic tag for k8gb (e.g., us, eu, ap)
                    priority:
                      type: integer
                      description: Priority level (lower = higher priority = preferred primary)
                      minimum: 1
                members:
                  type: array
                  description: All control planes in this resilience set
                  minItems: 1
                  maxItems: 20
                  x-kubernetes-validations:
                    - rule: self.all(m, self.exists_one(x, x.priority == m.priority))
                      message: >-
                        each member must have a distinct priority; equal
                        priorities break the higher/lower election partition and
                        can elect two leaders (split-brain)
                  items:
                    type: object
                    required:
                      - id
                      - provider
                      - region
                      - geoTag
                      - priority
                    properties:
                      id:
                        type: string
                        description: Member control plane ID
                      provider:
                        type: string
                        description: Member cloud provider
                        enum:
                          - aws
                          - azure
                          - gcp
                          - alibaba
                      region:
                        type: string
                        description: Member cloud region
                      geoTag:
                        type: string
                        description: Member geographic tag
                      priority:
                        type: integer
                        description: Member priority
                        minimum: 1
                      providerConfigName:
                        type: string
                        description: Provider config to read this member's heartbeat (defaults to spec.providerConfigName)
                gslb:
                  type: object
                  description: Global server load balancing configuration
                  required:
                    - hostname
                    - strategy
                  properties:
                    hostname:
                      type: string
                      description: The GSLB record whose health is watched
                    strategy:
                      type: string
                      description: >-
                        k8gb load-balancing strategy for WORKLOAD TRAFFIC (the
                        data plane): "failover" serves one geo at a time;
                        "roundRobin"/"geoip" serve multiple geos simultaneously
                        ("active-active" traffic). This affects traffic
                        distribution ONLY. It never changes control-plane
                        leadership: the set always has exactly ONE management
                        leader (managementPolicies ["*"]) with all others at
                        ["Observe"], in every strategy. All control planes receive
                        the same claims/XRs; only the leader reconciles them.
                      enum:
                        - failover
                        - roundRobin
                        - geoip
                      default: failover
                    manage:
                      type: boolean
                      description: >-
                        Whether the composition CREATES the k8gb Gslb for this
                        hostname (default true), so a single claim yields a
                        working GSLB signal. Set false to consume a Gslb you
                        manage yourself. The Gslb is only created once k8gb is
                        ready (its CRD exists).
                      default: true
                    ingressClassName:
                      type: string
                      description: Ingress class for the Gslb-managed ingress
                      default: nginx
                    backendServiceName:
                      type: string
                      description: >-
                        Name of the in-cluster Service the Gslb ingress routes
                        to (your workload). Ignored when demoApp is true.
                      default: app
                    demoApp:
                      type: boolean
                      description: >-
                        Render a tiny nginx Deployment+Service behind the Gslb so
                        k8gb has a real endpoint to health-check. Intended for
                        onboarding/tests; scaling it to zero drives a live GSLB
                        health failure.
                      default: false
                k8gb:
                  type: object
                  description: Optional k8gb installation configuration
                  properties:
                    install:
                      type: string
                      description: >-
                        Whether the composition installs the k8gb operator.
                        "auto" (default) installs it only if not already present,
                        so a single claim brings up GSLB with no manual steps;
                        "never" relies on heartbeat + priority alone; "always"
                        forces install.
                      enum:
                        - never
                        - auto
                        - always
                      default: auto
                    version:
                      type: string
                      description: k8gb version to install
                      default: v0.15.0
                    dnsProvider:
                      type: string
                      description: >-
                        external-dns provider for publishing the load-balanced
                        zone records (e.g. "aws" for Route53). When empty,
                        external-dns is left provider-agnostic (no cloud DNS
                        integration).
                      enum:
                        - ""
                        - aws
                        - azure
                        - google
                        - cloudflare
                      default: ""
                    extdnsCredentialsSecretName:
                      type: string
                      description: >-
                        Name of a Secret (in the k8gb namespace) holding the
                        external-dns provider credentials. For aws/Route53 it
                        must contain keys access_key_id, secret_access_key and
                        (optionally) session_token. PREFER ambient identity
                        (IRSA / Workload Identity) and leave this EMPTY; static
                        keys are currently wired as env vars on the external-dns
                        container, so scope them to Route53-only and rotate them.
                        See examples/resilientcontrolplane-gslb.yaml.
                    dnsZones:
                      type: array
                      description: DNS zones for k8gb
                      items:
                        type: object
                        required:
                          - parentZone
                          - loadBalancedZone
                        properties:
                          parentZone:
                            type: string
                            description: Parent DNS zone
                          loadBalancedZone:
                            type: string
                            description: Load balanced DNS zone
                          negTTL:
                            type: integer
                            description: Negative TTL in seconds
                            default: 30
                    edgeDNSServers:
                      type: array
                      description: Edge DNS servers
                      items:
                        type: string
                    logLevel:
                      type: string
                      description: k8gb operator log level
                      default: info
                      enum:
                        - debug
                        - info
                        - warn
                        - error
                    helmProviderConfigName:
                      type: string
                      description: provider-helm ProviderConfig used for the k8gb install
                      default: default
                heartbeat:
                  type: object
                  description: Heartbeat mechanism configuration
                  properties:
                    read:
                      type: string
                      description: >-
                        How peer heartbeats are READ. "mr" (default) reads the
                        provider-observed Observe MR, which is gated by the
                        provider --poll interval (10m default) and can cause
                        false-stale/split-brain unless freshnessTTLSeconds is
                        set above the poll. "directApi" reads the peer's cloud
                        resource directly in-function (seconds-fresh, no --poll
                        dependency). PREREQUISITE: the composition function pod
                        must have read-only credentials for every peer's cloud,
                        wired via a pre-created Function + DeploymentRuntimeConfig
                        (see examples/directapi-heartbeat.yaml). Without them the
                        direct read fails and the peer is treated as unreadable,
                        holding this CP at standby (fail-safe). The WRITE path is
                        unchanged either way.
                      enum:
                        - mr
                        - directApi
                      default: mr
                    livenessKey:
                      type: string
                      description: >-
                        Key under which each control plane stamps its last-reconcile
                        epoch — the liveness marker peers read to judge freshness.
                        Written as a tag on AWS/Azure and a label on GCP.
                      default: last-reconciliation-timestamp-utc
                    freshnessTTLSeconds:
                      type: integer
                      description: Heartbeat freshness TTL in seconds
                      default: 180
                      minimum: 30
                    writeThrottleSeconds:
                      type: integer
                      description: Minimum seconds between heartbeat writes
                      default: 60
                      minimum: 10
                    readTimeoutSeconds:
                      type: integer
                      description: >-
                        Per-call timeout (seconds) for directApi peer heartbeat
                        reads (heartbeat.read=directApi). Cross-cloud or cold
                        reads (e.g. an Azure-hosted function calling AWS SSM,
                        plus the first AAD/OIDC token fetch) can exceed a small
                        budget; too low yields spurious "peer unreadable" and
                        blocks leader election. Tunable at runtime via the claim
                        (no rebuild). Ignored in mr read mode.
                      default: 10
                      minimum: 1
                policyControl:
                  type: object
                  description: >-
                    Management policy control configuration. Only "convention"
                    mode is implemented today; "patch"/"both" (direct MR
                    patching) are NOT YET IMPLEMENTED — the function does not
                    read this block for patch mode (see docs/SPEC.md §9.2).
                  properties:
                    mode:
                      type: string
                      description: >-
                        Policy toggle mechanism. "convention" (default) is the
                        only implemented mode; "patch"/"both" are NOT YET
                        IMPLEMENTED (deferred, see docs/SPEC.md §9.2).
                      enum:
                        - convention
                        - patch
                        - both
                      default: convention
                    managedResourceSelector:
                      type: object
                      description: >-
                        Selector for managed resources (patch mode only). NOT YET
                        IMPLEMENTED — ignored until the patch path lands.
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                failback:
                  type: object
                  description: Automatic failback configuration
                  properties:
                    automatic:
                      type: boolean
                      description: >-
                        Enable automatic failback. NOT YET IMPLEMENTED as a
                        toggle — the function does not read this field; failback
                        is currently always automatic, damped by
                        hysteresisPeriods.
                      default: true
                    hysteresisPeriods:
                      type: integer
                      description: Number of consecutive healthy periods before failback
                      default: 3
                      minimum: 1
            status:
              type: object
              description: Observed state of the resilient control plane
              properties:
                role:
                  type: string
                  description: Current role in the resilience set
                  enum:
                    - leader
                    - standby
                managementPolicy:
                  type: array
                  description: Published management policy decision
                  items:
                    type: string
                selfHeartbeatEpoch:
                  type: integer
                  description: Epoch seconds last written to this CP's own heartbeat
                promotionCandidateSince:
                  type: string
                  description: Epoch seconds since this CP became a promotion candidate (failover hysteresis)
                reason:
                  type: string
                  description: Human-readable reason for current role/policy
                gslb:
                  type: object
                  description: GSLB status
                  properties:
                    healthy:
                      type: boolean
                      description: Whether GSLB considers this geo healthy
                    isActiveForGeo:
                      type: boolean
                      description: Whether GSLB considers this geo active
                peers:
                  type: array
                  description: Status of peer control planes
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Peer control plane ID
                      ageSeconds:
                        type: integer
                        description: Age of peer's heartbeat in seconds
                      fresh:
                        type: boolean
                        description: Whether peer's heartbeat is fresh
                      gslbHealthy:
                        type: boolean
                        description: Whether GSLB reports peer's geo healthy
                      definitivelyDown:
                        type: boolean
                        description: Whether peer is definitively down
                lastHandoffTime:
                  type: string
                  format: date-time
                  description: Timestamp of last leadership handoff
                conditions:
                  type: array
                  description: Standard Crossplane conditions
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      reason:
                        type: string
                      status:
                        type: string
                      type:
                        type: string
