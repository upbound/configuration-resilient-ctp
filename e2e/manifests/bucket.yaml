# Applied IDENTICALLY on BOTH control planes. Same bucketName -> same
# crossplane.io/external-name -> the ONE shared S3 bucket. The leader honors
# these intended managementPolicies; function-management-policies reduces them
# to ["Observe"] on the standby.
# NOTE: bucketName must be globally unique in S3 — change the suffix if taken.
apiVersion: s3.aws.platform.upbound.io/v1alpha1
kind: Bucket
metadata:
  name: shared
  namespace: default
spec:
  parameters:
    region: us-east-1
    bucketName: resilient-ctp-demo-shared-bucket-use1usw2
    # Intended policy for the shared bucket (author opt-in to resilience).
    # Omits Delete so failover/failback never deletes the shared bucket.
    managementPolicies:
      - Create
      - Update
      - Observe
