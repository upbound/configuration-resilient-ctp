    dnsZones:
      - parentZone: example.com
        loadBalancedZone: global.example.com
        negTTL: 30
    edgeDNSServers:
      - "1.1.1.1"
      - "8.8.8.8"
    logLevel: info
  heartbeat:
    livenessKey: last-reconciliation-timestamp-utc
