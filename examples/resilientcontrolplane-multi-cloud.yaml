    resilient.platform.upbound.io/description: "Secondary control plane in Azure West Europe"
spec:
  identity:
    id: ctp-westeurope
    provider: azure
    region: westeurope
    geoTag: eu
    priority: 2
  members:
    - id: ctp-us-east-1
      provider: aws
      region: us-east-1
      geoTag: us
      priority: 1
    - id: ctp-westeurope
      provider: azure
